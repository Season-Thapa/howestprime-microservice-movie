services:
  postgres:
    image: postgres
    ports:
      - 40021:5432
    volumes:
      - postgres:/data/postgres-howestprime-movies
    env_file:
      - .movies-howestprime-dev.env
    networks:
      - movies-howestprime-dev

  MessageBroker.movies-howestprime.dev:
    image: cloudamqp/lavinmq
    restart: unless-stopped
    networks:
      - movies-howestprime-dev
    ports:
      - 40100:5672
      - 40101:15672
networks:
  movies-howestprime-dev:
    name: movies-howestprime-dev

volumes:
  postgres:
