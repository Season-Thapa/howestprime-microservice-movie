name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run unit tests
        run: dotnet test test/UnitTests/UnitTests.csproj --configuration Release --verbosity normal --no-restore

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Run coverage check
        run: |
          dotnet test test/UnitTests/UnitTests.csproj --configuration Release --no-restore \
            /p:CollectCoverage=true \
            /p:CoverletOutput=./TestResults/coverage/ \
            /p:CoverletOutputFormat=opencover \
            /p:Threshold=97 \
            /p:ThresholdType=line \
            /p:Include=\"[Howestprime.Movies.Application]*,[Howestprime.Movies.Domain]*\"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: test/UnitTests/TestResults/coverage/
